<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault - Network</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ff00; padding-bottom: 10px; margin-bottom: 20px; }
        .invite-box { background: #111; border: 1px dashed #00ff00; padding: 20px; text-align: center; margin-bottom: 20px; box-shadow: inset 0 0 10px #000; }
        .input-box { display: flex; margin-bottom: 20px; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 12px; background: #000; color: #00ff00; border: 1px solid #00ff00; outline: none; }
        button { padding: 10px 15px; background: #00ff00; color: #000; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #fff; }
        .topic-card { background: #111; border: 1px solid #004400; padding: 15px; margin-bottom: 10px; cursor: pointer; }
        .topic-card:hover { border-color: #00ff00; }
        .message-card { background: #000; border-left: 3px solid #00ff00; padding: 10px; margin-bottom: 10px; font-size: 0.9em; }
        #thread-view { display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h2 style="margin:0; letter-spacing: 2px;">THE VAULT <span style="font-size: 0.5em; color: cyan;">v2.0</span></h2>
            <div id="rank-display" style="font-size: 0.8em; color: #888;">INITIALIZING...</div>
        </div>
        <button id="logout-btn" style="background: #660000; color: white;">LOGOUT</button>
    </div>

    <div class="invite-box">
        <span style="font-size: 0.8em; color: #888;">YOUR UNIQUE RECRUITMENT KEY:</span><br>
        <strong id="my-invite-code" style="color: white; font-size: 1.6em; letter-spacing: 3px; display: block; margin-top: 5px;">SYNCING...</strong>
    </div>

    <div id="inbox-view">
        <div class="input-box">
            <input type="text" id="new-topic-input" placeholder="Start new thread...">
            <button id="create-topic-btn">CREATE</button>
        </div>
        <div id="topics-feed"></div>
    </div>

    <div id="thread-view">
        <button onclick="location.reload()" style="background:#333; color:white; margin-bottom:15px; padding: 5px 10px;">← BACK</button>
        <h3 id="thread-title" style="color: white; border-bottom: 1px solid #222; padding-bottom: 10px;"></h3>
        <div class="input-box">
            <input type="text" id="reply-input" placeholder="Enter intel...">
            <button id="submit-reply-btn">SUBMIT</button>
        </div>
        <div id="replies-feed"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://fobshgegvpbzfilqycpb.supabase.co';
    const supabaseKey = 'sb_publishable_BlynNUCxwVjeeLhPQNtHQg_3x5kPY5o';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const CAPTAIN_EMAIL = 'captain2@network.com'; 
    let activeTopicId = null;

async function loadTopics() {
        const { data } = await supabaseClient.from('topics').select('*').order('id', { ascending: false });
        const feed = document.getElementById('topics-feed');
        feed.innerHTML = '';
        if(data) data.forEach(t => {
            const card = document.createElement('div');
            card.className = 'topic-card';
            card.innerText = t.subject;
            card.onclick = () => openThread(t.id, t.subject);
            feed.appendChild(card);
        });
    }

    async function openThread(id, title) {
        activeTopicId = id;
        document.getElementById('inbox-view').style.display = 'none';
        document.getElementById('thread-view').style.display = 'block';
        document.getElementById('thread-title').innerText = title;
        loadReplies();
    }

    async function init() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return window.location.href = 'index.html';

    // 1. Set Rank Display
    const isCaptain = (user.email === 'captain2@network.com');
    document.getElementById('rank-display').innerText = isCaptain ? "RANK: CAPTAIN" : "RANK: PIRATE";

    // 2. Just FETCH the identity (The database already created it!)
    let { data: profile } = await supabaseClient
        .from('profiles')
        .select('recruit_code')
        .eq('id', user.id)
        .single();

    // 3. Display the code or a fallback if something goes wrong
    document.getElementById('my-invite-code').innerText = profile ? profile.recruit_code : "UNAUTHORIZED";

    loadTopics();
}
    };
init();

    async function loadTopics() {
        const { data } = await supabaseClient.from('topics').select('*').order('id', { ascending: false });
        const feed = document.getElementById('topics-feed');
        feed.innerHTML = '';
        if(data) data.forEach(t => {
            const card = document.createElement('div');
            card.className = 'topic-card';
            card.innerText = t.subject;
            card.onclick = () => openThread(t.id, t.subject);
            feed.appendChild(card);
        });
    }

    async function openThread(id, title) {
        activeTopicId = id;
        document.getElementById('inbox-view').style.display = 'none';
        document.getElementById('thread-view').style.display = 'block';
        document.getElementById('thread-title').innerText = title;
        loadReplies();
    }

    async function loadReplies() {
        const { data } = await supabaseClient.from('intel').select('*').eq('topic_id', activeTopicId).order('id', { ascending: false });
        const feed = document.getElementById('replies-feed');
        feed.innerHTML = '';
        if(data) data.forEach(m => {
            const nameColor = m.username === 'CAPTAIN' ? 'red' : '#00ff00';
            feed.innerHTML += `<div class="message-card"><strong style="color:${nameColor}">${m.username}</strong>: ${m.message}</div>`;
        });
    }

    document.getElementById('create-topic-btn').onclick = async () => {
        const sub = document.getElementById('new-topic-input').value;
        if(sub) { await supabaseClient.from('topics').insert([{ subject: sub }]); location.reload(); }
    };

    document.getElementById('submit-reply-btn').onclick = async () => {
        const msg = document.getElementById('reply-input').value;
        const alias = localStorage.getItem('pirate_alias') || "PIRATE";
        if(msg && activeTopicId) {
            const isCap = document.getElementById('rank-display').innerText.includes('CAPTAIN');
            await supabaseClient.from('intel').insert([{ 
                topic_id: activeTopicId, 
                message: msg, 
                username: isCap ? "CAPTAIN" : alias 
            }]);
            document.getElementById('reply-input').value = '';
            loadReplies();
        }
    };

    document.getElementById('logout-btn').onclick = async () => { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; };
</script>
</body>

</html>
