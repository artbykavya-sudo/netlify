<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault - Private Feed</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .vault-header { border-bottom: 2px solid #00ff00; padding-bottom: 10px; margin-bottom: 20px; text-align: center; }
        .gate-box { background: #111; padding: 20px; border: 1px dashed #00ff00; margin-bottom: 20px; }
        input { background: #000; color: #00ff00; border: 1px solid #00ff00; padding: 10px; width: calc(100% - 22px); margin-bottom: 10px; outline: none; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; width: 100%; }
        .message-card { background: #111; border-left: 3px solid #00ff00; padding: 15px; margin-bottom: 10px; }
        .timestamp { font-size: 0.7em; color: #555; display: block; margin-top: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="vault-header">
        <h1>THE VAULT</h1>
        <p style="font-size: 0.8em; color: #444;">INTERNAL NETWORK ONLY</p>
    </div>

    <div class="gate-box">
        <input type="password" id="access-key" placeholder="ENTER ACCESS KEY TO POST">
        <input type="text" id="username-input" placeholder="YOUR CALLSIGN (e.g. GHOST-01)">
        <input type="text" id="msg-input" placeholder="BROADCAST INTEL...">
        <button id="send-btn">SEND BROADCAST</button>
    </div>

    <div id="feed"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://fobshgegvpbzfilqycpb.supabase.co';
    const supabaseKey = 'sb_publishable_BlynNUCxwVjeeLhPQNtHQg_3x5kPY5o';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const MASTER_KEY = "PIRATE-2026"; // CHANGE THIS TO YOUR SECRET KEY

    async function loadMessages() {
        const { data } = await supabaseClient.from('intel').select('*').order('id', { ascending: false });
        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        if (data) {
            data.forEach(m => {
                feed.innerHTML += `<div class="message-card"><strong>${m.username}</strong>: ${m.message}</div>`;
            });
        }
    }

    document.getElementById('send-btn').onclick = async () => {
        const key = document.getElementById('access-key').value;
        const user = document.getElementById('username-input').value;
        const msg = document.getElementById('msg-input').value;

        if (key !== MASTER_KEY) {
            alert("INVALID ACCESS KEY. BROADCAST BLOCKED.");
            return;
        }

        if (msg && user) {
            await supabaseClient.from('intel').insert([{ message: msg, username: user }]);
            document.getElementById('msg-input').value = '';
            loadMessages();
        } else {
            alert("FILL ALL FIELDS.");
        }
    };

    loadMessages();
    setInterval(loadMessages, 5000); // Auto-refresh every 5 seconds
</script>
</body>
</html>
