<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault - Network</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ff00; padding-bottom: 10px; margin-bottom: 20px; }
        .invite-box { background: #111; border: 1px dashed #00ff00; padding: 20px; text-align: center; margin-bottom: 20px; }
        .generator-box { background: #050505; border: 1px solid #333; padding: 15px; text-align: center; margin-bottom: 20px; }
        .input-box { display: flex; margin-bottom: 20px; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 12px; background: #000; color: #00ff00; border: 1px solid #00ff00; outline: none; }
        button { padding: 10px 15px; background: #00ff00; color: #000; border: none; font-weight: bold; cursor: pointer; }
        .message-card { background: #000; border-left: 3px solid #00ff00; padding: 10px; margin-bottom: 10px; font-size: 0.9em; word-wrap: break-word; }
        #new-key-display { color: yellow; display: block; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 style="margin:0; letter-spacing: 2px;">THE VAULT <span style="font-size: 0.5em; color: cyan;">v3.0</span></h2>
        <button id="logout-btn" style="background: #660000; color: white;">LOGOUT</button>
    </div>

    <div class="invite-box">
        <span style="font-size: 0.8em; color: #888;">IDENTITY:</span>
        <strong id="my-invite-code" style="color: white; font-size: 1.6em; display: block;">SYNCING...</strong>
    </div>

    <div class="generator-box">
        <button id="generate-key-btn" style="background: #222; color: #00ff00; border: 1px solid #00ff00;">GENERATE 1-TIME INVITE KEY</button>
        <span id="new-key-display"></span>
    </div>

    <div class="input-box">
        <input type="text" id="msg-input" placeholder="Broadcast intel...">
        <button id="send-btn">SEND</button>
    </div>

    <div id="feed"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://fobshgegvpbzfilqycpb.supabase.co';
    const supabaseKey = 'sb_publishable_BlynNUCxwVjeeLhPQNtHQg_3x5kPY5o';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('logout-btn').onclick = async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    };

    async function init() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return window.location.href = 'index.html';

        let { data: profile } = await supabaseClient.from('profiles').select('recruit_code').eq('id', user.id).maybeSingle();
        
        // If profile doesn't exist, create it
        if (!profile) {
            const { count } = await supabaseClient.from('profiles').select('*', { count: 'exact', head: true });
            let newCode = "GHOST-PIRATE-" + (count + 1).toString().padStart(2, '0');
            if (user.email === 'captain2@network.com') newCode = 'GHOST-CHIEF-00';
            
            await supabaseClient.from('profiles').insert([{ id: user.id, recruit_code: newCode }]);
            document.getElementById('my-invite-code').innerText = newCode;
        } else {
            document.getElementById('my-invite-code').innerText = profile.recruit_code;
        }

        loadMessages();
    }

    async function loadMessages() {
        // MATCHING YOUR SCREENSHOT: Table 'intel', Column 'message' and 'username'
        const { data, error } = await supabaseClient
            .from('intel')
            .select('message, username') 
            .order('id', { ascending: false });

        if (error) {
            console.error("Error loading feed:", error);
            return;
        }

        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        if (data) {
            data.forEach(m => {
                // We use the exact names from your screenshot
                feed.innerHTML += `<div class="message-card"><strong style="color: #00ff00">${m.username || 'ANON'}</strong>: ${m.message}</div>`;
            });
        }
    }

    document.getElementById('generate-key-btn').onclick = async () => {
        const randomString = Math.random().toString(36).substr(2, 5).toUpperCase();
        const newInviteKey = "KEY-" + randomString;
        await supabaseClient.from('invites').insert([{ code: newInviteKey, is_used: false }]);
        document.getElementById('new-key-display').innerText = "NEW KEY: " + newInviteKey;
    };

    document.getElementById('send-btn').onclick = async () => {
        const msg = document.getElementById('msg-input').value;
        const myName = document.getElementById('my-invite-code').innerText;
        if (msg) {
            // MATCHING YOUR SCREENSHOT: Insert into 'message' and 'username'
            await supabaseClient.from('intel').insert([{ message: msg, username: myName }]);
            document.getElementById('msg-input').value = '';
            loadMessages();
        }
    };

    init();
</script>
</body>
</html>
