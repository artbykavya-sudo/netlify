<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault - Private Feed</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; height: 95vh; }
        .vault-header { border-bottom: 2px solid #00ff00; padding: 10px 0; margin-bottom: 15px; text-align: center; flex-shrink: 0; }
        
        /* THE INPUT BOX */
        .gate-box { background: #111; padding: 15px; border: 1px solid #333; margin-bottom: 15px; flex-shrink: 0; }
        input { background: #000; color: #00ff00; border: 1px solid #004400; padding: 10px; width: calc(100% - 22px); margin-bottom: 8px; outline: none; font-family: inherit; }
        input:focus { border-color: #00ff00; }
        button { background: #00ff00; color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; width: 100%; letter-spacing: 2px; }
        
        /* THE INBOX - Page within a page */
        #feed { 
            background: #050505; 
            border: 2px solid #00ff00; 
            padding: 15px; 
            overflow-y: auto; 
            flex-grow: 1; /* This makes it fill the remaining space */
            box-shadow: inset 0 0 15px #00ff0022;
        }

        .message-card { 
            background: #111; 
            border-left: 3px solid #00ff00; 
            padding: 12px; 
            margin-bottom: 10px; 
            font-size: 0.9em;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .callsign { color: #00ff00; font-weight: bold; text-transform: uppercase; }
        .text { color: #ccc; margin-left: 5px; }
        
        /* Custom Scrollbar for the Vault look */
        #feed::-webkit-scrollbar { width: 5px; }
        #feed::-webkit-scrollbar-thumb { background: #004400; }
    </style>
</head>
<body>
<div class="container">
    <div class="vault-header">
        <h1 style="margin:0; letter-spacing: 5px;">THE VAULT</h1>
    </div>

    <div class="gate-box">
        <input type="password" id="access-key" placeholder="ACCESS KEY">
        <input type="text" id="username-input" placeholder="CALLSIGN">
        <input type="text" id="msg-input" placeholder="TYPE INTEL...">
        <button id="send-btn">SEND BROADCAST</button>
    </div>

    <div id="feed">
        <div style="text-align:center; color:#333;">INITIALIZING FEED...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://fobshgegvpbzfilqycpb.supabase.co';
    const supabaseKey = 'sb_publishable_BlynNUCxwVjeeLhPQNtHQg_3x5kPY5o';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    const MASTER_KEY = "PIRATE-2026"; 

    async function loadMessages() {
        const { data } = await supabaseClient.from('intel').select('*').order('id', { ascending: false });
        const feed = document.getElementById('feed');
        if (data) {
            feed.innerHTML = data.map(m => `
                <div class="message-card">
                    <span class="callsign">${m.username}</span>: 
                    <span class="text">${m.message}</span>
                </div>
            `).join('');
        }
    }

    document.getElementById('send-btn').onclick = async () => {
        const key = document.getElementById('access-key').value;
        const user = document.getElementById('username-input').value;
        const msg = document.getElementById('msg-input').value;

        if (key !== MASTER_KEY) {
            alert("KEY REJECTED.");
            return;
        }

        if (msg && user) {
            await supabaseClient.from('intel').insert([{ message: msg, username: user }]);
            document.getElementById('msg-input').value = '';
            loadMessages();
        }
    };

    loadMessages();
    setInterval(loadMessages, 5000); 
</script>
</body>
</html>
