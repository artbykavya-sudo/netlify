<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault - Intel Feed</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 700px; display: flex; flex-direction: column; height: 95vh; }
        .vault-header { border-bottom: 2px solid #00ff00; padding: 10px 0; margin-bottom: 20px; text-align: center; flex-shrink: 0; }
        
        /* INPUT AREA */
        .input-section { background: #111; padding: 15px; border: 1px solid #333; margin-bottom: 20px; flex-shrink: 0; }
        input { background: #000; color: #00ff00; border: 1px solid #004400; padding: 12px; width: calc(100% - 26px); margin-bottom: 10px; outline: none; font-family: inherit; }
        input:focus { border-color: #00ff00; }
        button { background: #00ff00; color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; width: 100%; letter-spacing: 3px; }
        button:hover { background: #fff; }
        
        /* THE FEED CONTAINER */
        #feed { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding-right: 10px;
        }

        /* INDIVIDUAL MESSAGE CARDS */
        .message-card { 
            background: #050505; 
            border: 1px solid #00ff00; 
            padding: 15px; 
            margin-bottom: 15px; 
            box-shadow: 0 0 10px #00ff0011;
        }

        .callsign-tag { 
            color: #00ff00; 
            font-weight: bold; 
            text-transform: uppercase; 
            border-bottom: 1px solid #004400;
            display: block;
            margin-bottom: 8px;
            font-size: 0.8em;
            letter-spacing: 1px;
        }

        .intel-body { color: #88ff88; line-height: 1.4; white-space: pre-wrap; }

        /* Scrollbar */
        #feed::-webkit-scrollbar { width: 4px; }
        #feed::-webkit-scrollbar-thumb { background: #00ff00; }
    </style>
</head>
<body>
<div class="container">
    <div class="vault-header">
        <h1 style="margin:0; letter-spacing: 8px;">THE VAULT</h1>
    </div>

    <div class="input-section">
        <input type="password" id="access-key" placeholder="ACCESS KEY (VAULT2026)">
        <input type="text" id="username-input" placeholder="CALLSIGN">
        <input type="text" id="msg-input" placeholder="RECORD INTEL...">
        <button id="send-btn">SEND BROADCAST</button>
    </div>

    <div id="feed">
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://fobshgegvpbzfilqycpb.supabase.co';
    const supabaseKey = 'sb_publishable_BlynNUCxwVjeeLhPQNtHQg_3x5kPY5o';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // THIS IS THE SECRET KEY
    const MASTER_KEY = "VAULT2026"; 

    async function loadMessages() {
        const { data } = await supabaseClient.from('intel').select('*').order('id', { ascending: false });
        const feed = document.getElementById('feed');
        if (data) {
            feed.innerHTML = data.map(m => `
                <div class="message-card">
                    <span class="callsign-tag">ID: ${m.username || 'UNKNOWN'}</span>
                    <div class="intel-body">${m.message}</div>
                </div>
            `).join('');
        }
    }

    document.getElementById('send-btn').onclick = async () => {
        const key = document.getElementById('access-key').value;
        const user = document.getElementById('username-input').value;
        const msg = document.getElementById('msg-input').value;

        if (key !== MASTER_KEY) {
            alert("KEY REJECTED. ENSURE ACCESS KEY IS CORRECT.");
            return;
        }

        if (msg && user) {
            const { error } = await supabaseClient.from('intel').insert([{ message: msg, username: user }]);
            if (error) {
                alert("DATABASE ERROR: " + error.message);
            } else {
                document.getElementById('msg-input').value = '';
                loadMessages();
            }
        } else {
            alert("BOTH CALLSIGN AND INTEL ARE REQUIRED.");
        }
    };

    loadMessages();
    setInterval(loadMessages, 5000); 
</script>
</body>
</html>
