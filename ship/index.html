<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Ledger - Entry</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { border: 1px solid #00ff00; padding: 30px; width: 320px; background-color: #111; box-shadow: 0 0 15px #00ff00; }
        h2 { text-align: center; letter-spacing: 3px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #000; color: #00ff00; border: 1px solid #00ff00; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 10px; background: #00ff00; color: #000; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .toggle-text { text-align: center; margin-top: 15px; font-size: 0.8em; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>IDENTIFY</h2>
    
    <div id="register-section" style="display: none;">
        <input type="text" id="reg-username" placeholder="Pirate Alias (Username)">
        <input type="text" id="reg-code" placeholder="Invite Code">
        <input type="email" id="reg-email" placeholder="Email">
        <input type="password" id="reg-password" placeholder="Password">
        <button id="register-btn">REGISTER</button>
        <p class="toggle-text" onclick="toggleView()">Already in the crew? Log in.</p>
    </div>

    <div id="login-section">
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button id="login-btn">ENTER</button>
        <p class="toggle-text" onclick="toggleView()">Have an invite code? Register.</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://fobshgegvpbzfilqycpb.supabase.co';
    const supabaseKey = 'sb_publishable_BlynNUCxwVjeeLhPQNtHQg_3x5kPY5o';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    function toggleView() {
        document.getElementById('login-section').style.display = document.getElementById('login-section').style.display === 'none' ? 'block' : 'none';
        document.getElementById('register-section').style.display = document.getElementById('register-section').style.display === 'none' ? 'block' : 'none';
    }

    document.getElementById('register-btn').addEventListener('click', async () => {
        const alias = document.getElementById('reg-username').value;
        const code = document.getElementById('reg-code').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        if (!alias || !code || !email || !password) return alert('All fields required.');

        // Check Invite Code against Supabase
        const { data: inviteData, error: inviteError } = await supabaseClient
            .from('invites').select('*').eq('code', code).eq('is_used', false).single();

        if (inviteError || !inviteData) {
            return alert('Invalid or burned code. Contact the Captain.');
        }

        // Register the User in Supabase Auth
        const { error: authError } = await supabaseClient.auth.signUp({ email, password });
        if (authError) return alert(authError.message);

        // Burn code if it's NOT the Master Key
        if (code !== 'CAPTAIN-KEY') {
            await supabaseClient.from('invites').update({ is_used: true }).eq('code', code);
        }

        // SAFETY PATCH: Save Pirate details to the browser memory
        localStorage.setItem('pirate_alias', alias);
        localStorage.setItem('my_invite_code', code);

        alert('Verified. Welcome to the network, ' + alias);
        window.location.href = 'board.html';
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        
        if (error) {
            alert(error.message);
        } else {
            // Check if we need to set a default alias if they logged in without registering on this device
            if (!localStorage.getItem('pirate_alias')) {
                localStorage.setItem('pirate_alias', 'RE-LOGGED_PIRATE');
            }
            window.location.href = 'board.html';
        }
    });
</script>
</body>
</html>
