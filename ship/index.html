<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Vault - Terminal Access</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #111; padding: 30px; border: 2px solid #00ff00; box-shadow: 0 0 20px #00ff0033; width: 320px; text-align: center; }
        h2 { letter-spacing: 5px; margin-bottom: 25px; border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
        input { width: 90%; padding: 10px; margin-bottom: 15px; background: #000; border: 1px solid #004400; color: #00ff00; outline: none; }
        input:focus { border-color: #00ff00; }
        button { width: 97%; padding: 12px; background: #00ff00; color: #000; border: none; font-weight: bold; cursor: pointer; letter-spacing: 2px; }
        button:hover { background: #fff; }
        .toggle-link { margin-top: 15px; font-size: 0.8em; color: #888; cursor: pointer; text-decoration: underline; display: block; }
    </style>
</head>
<body>

<div class="login-box">
    <h2 id="form-title">LOGIN</h2>
    
    <form id="auth-form">
        <input type="email" id="email" placeholder="ENCRYPTED EMAIL" required>
        <input type="password" id="password" placeholder="ACCESS KEY" required>
        <input type="text" id="invite-code" placeholder="VIP INVITE CODE" style="display:none;">
        
        <button type="submit" id="submit-btn">ENTER VAULT</button>
    </form>

    <span class="toggle-link" id="toggle-auth">NEED CLEARANCE? REGISTER</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabaseUrl = 'https://fobshgegvpbzfilqycpb.supabase.co';
    const supabaseKey = 'sb_publishable_BlynNUCxwVjeeLhPQNtHQg_3x5kPY5o';
    
    // REINFORCED CONNECTION: Prevents "Tracking Prevention" blocks
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey, {
        auth: {
            persistSession: false,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    });

    let isLogin = true;
    const formTitle = document.getElementById('form-title');
    const inviteInput = document.getElementById('invite-code');
    const submitBtn = document.getElementById('submit-btn');
    const toggleLink = document.getElementById('toggle-auth');

    // Switch between Login and Register
    toggleLink.onclick = () => {
        isLogin = !isLogin;
        formTitle.innerText = isLogin ? "LOGIN" : "REGISTER";
        submitBtn.innerText = isLogin ? "ENTER VAULT" : "REQUEST ACCESS";
        inviteInput.style.display = isLogin ? "none" : "block";
        toggleLink.innerText = isLogin ? "NEED CLEARANCE? REGISTER" : "ALREADY RECRUITED? LOGIN";
    };

    document.getElementById('auth-form').onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const inviteCode = document.getElementById('invite-code').value;

        if (isLogin) {
            // LOGIN LOGIC
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert("ACCESS DENIED: " + error.message);
            else window.location.href = 'board.html';
        } else {
            // REGISTRATION LOGIC
            // Master Override for the Captain
            if (inviteCode !== 'CAPTAIN-KEY') {
                // Check if the invite code is valid in the 'invites' table
                const { data: inviteData, error: inviteError } = await supabaseClient
                    .from('invites')
                    .select('*')
                    .eq('code', inviteCode)
                    .eq('is_used', false)
                    .maybeSingle();

                if (inviteError || !inviteData) {
                    alert("INVALID OR EXPIRED INVITE CODE.");
                    return;
                }
                
                // Burn the code so it can't be used again
                await supabaseClient.from('invites').update({ is_used: true }).eq('code', inviteCode);
            }

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert("REGISTRATION FAILED: " + error.message);
            else alert("RECRUITED. PLEASE LOGIN NOW.");
        }
    };
</script>
</body>
</html>
